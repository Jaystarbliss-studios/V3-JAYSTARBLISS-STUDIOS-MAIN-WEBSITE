[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22.23.2"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/parent-enrollment-request"
  to = "/.netlify/functions/parent-enrollment-request"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
