name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --no-save

      - name: Lint
        run: bun run lint

      - name: Typecheck and production build
        run: bun run build
