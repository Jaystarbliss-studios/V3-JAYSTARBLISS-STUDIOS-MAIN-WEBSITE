name: Apply Admin Integrity Patch

# Temporary migration runner; removed automatically after a successful patch.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/maintenance-admin-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-integrity]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply staged patch
        run: python3 .github/admin-integrity-patch.py
      - name: Reconcile dependencies and build
        run: |
          npm install
          npm run build
      - name: Commit and clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/admin-integrity-patch.py .github/workflows/maintenance-admin-integrity.yml
          git add src/pages/admin/AdminStudents.tsx src/pages/admin/AdminStaff.tsx package-lock.json .github/admin-integrity-patch.py .github/workflows/maintenance-admin-integrity.yml
          git commit -m 'fix: harden admin account integrity [admin-integrity]'
          git push origin main
