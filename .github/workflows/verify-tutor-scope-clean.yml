name: Verify tutor scope clean branch
on:
  push:
    branches: [fix/tutor-school-private-schedule-scope-main-base]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Remove temporary verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-tutor-scope-clean.yml
          git commit -m "chore: remove temporary clean branch verifier"
          git push
