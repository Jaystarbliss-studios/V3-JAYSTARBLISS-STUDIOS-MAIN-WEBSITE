name: Maintenance - Admin Users

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'migrate admin user onboarding') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply onboarding migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/admin/AdminUsers.tsx')
          text = path.read_text()

          text = text.replace(
              "import { collection, getDocs, doc, updateDoc, setDoc } from 'firebase/firestore';",
              "import { collection, getDocs, doc, updateDoc } from 'firebase/firestore';"
          )
          text = text.replace(
              "import { db } from '../../lib/firebase';",
              "import { auth, db } from '../../lib/firebase';"
          )

          start = text.index("  const handleInvite = async (e: React.FormEvent) => {")
          end = text.index("\n\n  const exportToCSV = () => {", start)
          replacement = '''  const handleInvite = async (e: React.FormEvent) => {
    e.preventDefault();
    const cleanEmail = inviteEmail.trim().toLowerCase();
    if (!cleanEmail || !auth.currentUser) {
      toast.error('Your admin session is no longer active. Please sign in again.');
      return;
    }

    setInviting(true);
    try {
      const token = await auth.currentUser.getIdToken();
      const response = await fetch('/.netlify/functions/admin-onboard', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          name: inviteName.trim(),
          email: cleanEmail,
          role: inviteRole,
          forcePasswordReset
        })
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Failed to onboard user.');

      const temporaryPassword = String(payload.temporaryPassword || '');
      let copied = false;
      if (temporaryPassword && navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(temporaryPassword);
          copied = true;
        } catch {}
      }

      toast.success(
        copied
          ? `Account created for ${cleanEmail}. The temporary password was copied to your clipboard.`
          : `Account created for ${cleanEmail}. Use the displayed temporary password to complete setup.`
      );

      if (temporaryPassword) {
        window.prompt(`Temporary password for ${cleanEmail}. Share it securely, then have the user change it immediately.`, temporaryPassword);
      }

      setShowInviteModal(false);
      setInviteEmail('');
      setInviteName('');
      setForcePasswordReset(true);
    } catch (err) {
      console.error('Admin onboarding error:', err);
      toast.error(err instanceof Error ? err.message : 'Failed to onboard user. Please try again.');
    } finally {
      setInviting(false);
    }
  };'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          print('AdminUsers onboarding migration applied.')
          PY

      - name: Remove migration workflow and commit
        run: |
          rm -f .github/workflows/maintenance-admin-users.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/AdminUsers.tsx .github/workflows/maintenance-admin-users.yml
          git commit -m 'chore: migrate admin user onboarding' || exit 0
          git push origin main
