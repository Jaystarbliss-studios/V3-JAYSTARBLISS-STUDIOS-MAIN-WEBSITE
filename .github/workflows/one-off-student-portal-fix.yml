name: One-off student portal fix

on:
  push:
    branches:
      - feat/student-schedule-and-portal-controls

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[one-off-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/student-schedule-and-portal-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/one-off-student-portal-fix.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ParentDashboard.tsx src/pages/portal/PortalSettings.tsx src/components/portal/PortalLayout.tsx scripts/one-off-student-portal-fix.mjs .github/workflows/one-off-student-portal-fix.yml
          git commit -m "fix: dedupe parent students and gate student portal features [one-off-fix]"
          git push origin HEAD:feat/student-schedule-and-portal-controls
