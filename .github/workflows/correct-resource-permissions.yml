name: Correct resource permissions

on:
  push:
    branches: [fix/curriculum-resource-permissions]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[resource-permissions-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply resource permission corrections
        shell: python
        run: |
          from pathlib import Path

          # 1) School administrators retain normal resource/class-assignment management.
          resource = Path('src/pages/portal/ResourceLibrary.tsx')
          text = resource.read_text()
          old = """  const handleSaveClassAssignment = async () => {\n    if (!canManageCurriculum) {\n      toast.error('Only tutors and the super admin can manage curriculum assignments.');\n      return;\n    }"""
          new = """  const handleSaveClassAssignment = async () => {\n    if (role !== 'school' && !canManageCurriculum) {\n      toast.error('Only school administrators, tutors, and the super admin can manage resource assignments.');\n      return;\n    }"""
          if old not in text:
              raise SystemExit('ResourceLibrary class-assignment guard not found')
          text = text.replace(old, new, 1)

          old = "showAssignButton={canManageCurriculum}"
          new = "showAssignButton={role === 'school' || canManageCurriculum}"
          if old not in text:
              raise SystemExit('ResourceLibrary assign button binding not found')
          text = text.replace(old, new, 1)
          resource.write_text(text)

          # 2) Curriculum/program uploads are restricted to tutors and super admin,
          # while tutors are only allowed to update curriculum fields on programs.
          rules = Path('firestore.rules')
          text = rules.read_text()
          old = """    match /schoolResources/{resourceId} { \n      allow read: if true; \n      allow create: if isTutorOrSuperAdmin();\n      allow update: if isTutorOrSuperAdmin();\n      allow delete: if isTutorOrSuperAdmin();\n    }"""
          new = """    match /schoolResources/{resourceId} { \n      allow read: if true; \n      allow create: if isAnyAdmin() || isSchoolUser() || isSameSchool(request.resource.data.schoolId);\n      allow update: if isAnyAdmin() || isSchoolUser() || (isSameSchool(resource.data.schoolId) && isSameSchool(request.resource.data.schoolId));\n      allow delete: if isAnyAdmin() || isSchoolUser() || isSameSchool(resource.data.schoolId);\n    }"""
          if old not in text:
              raise SystemExit('schoolResources rules block not found')
          text = text.replace(old, new, 1)

          old = """    match /programs/{document=**} { allow read: if true; allow write: if isAnyAdmin(); }"""
          new = """    match /programs/{document=**} { \n      allow read: if true;\n      allow create, delete: if isAnyAdmin();\n      allow update: if isAnyAdmin() || (isTutorOrSuperAdmin() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['curriculumPdfUrl','curriculumTitle','curriculumSummary','curriculum','topics','updatedAt']));\n    }"""
          if old not in text:
              raise SystemExit('programs rules block not found')
          text = text.replace(old, new, 1)
          rules.write_text(text)

          # 3) The student course view is read-only for curriculum. It can read a
          # curriculum document, but must not present upload controls to students.
          courses = Path('src/pages/portal/PortalCourses.tsx')
          text = courses.read_text()
          old = """          {selectedModule && (\n            <button\n              type=\"button\"\n              onClick={() => handleOpenCurriculumModal(selectedModule)}\n              className=\"inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl bg-brand-red/10 border border-brand-red/30 text-brand-red text-xs font-bold hover:bg-brand-red hover:text-white transition-all cursor-pointer\"\n            >\n              <Upload size={14} />\n              <span>Upload / Link Curriculum</span>\n            </button>\n          )}"""
          if old not in text:
              raise SystemExit('student header curriculum upload control not found')
          text = text.replace(old, '', 1)

          old = """                    ) : (\n                      <button\n                        type=\"button\"\n                        onClick={() => handleOpenCurriculumModal(selectedModule)}\n                        className=\"px-3.5 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold hover:border-brand-red hover:text-brand-red transition-all flex items-center gap-1.5 cursor-pointer\"\n                      >\n                        <Upload size={13} />\n                        <span>Upload Curriculum</span>\n                      </button>\n                    )}"""
          new = """                    ) : (\n                      <span className=\"px-3.5 py-2 rounded-xl border border-dashed border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 text-xs font-bold\">Curriculum not linked yet</span>\n                    )}"""
          if old not in text:
              raise SystemExit('student curriculum empty-state upload control not found')
          text = text.replace(old, new, 1)
          courses.write_text(text)
      
      - name: Install dependencies
        run: npm install

      - name: Typecheck and production build
        run: npm run build

      - name: Commit corrected files and remove patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/correct-resource-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules src/pages/portal/ResourceLibrary.tsx src/pages/portal/PortalCourses.tsx .github/workflows/correct-resource-permissions.yml
          git commit -m "fix: restore school resource management and lock curriculum uploads [resource-permissions-patched]"
          git push
