name: One-time Next Phase Implementation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'next-phase implementation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply coordinated implementation fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          portal = Path('src/pages/Portal.tsx')
          text = portal.read_text()
          old = """      } else {\n        const parentDoc = await getDoc(doc(db, 'parents', user.uid));\n        if (parentDoc.exists()) {\n          detectedRole = 'PARENT';\n          if (parentDoc.data().name) detectedName = parentDoc.data().name;\n        }\n\n        if (!detectedRole) {\n          const tutorDoc = await getDoc(doc(db, 'tutors', user.uid));\n          if (tutorDoc.exists()) {\n            detectedRole = 'STAFF';\n            if (tutorDoc.data().name) detectedName = tutorDoc.data().name;\n          }\n        }\n\n        const initialRole = detectedRole ? detectedRole.toLowerCase() : activeTab;\n        await setDoc(doc(db, 'users', user.uid), {\n          email: user.email?.toLowerCase(),\n          name: detectedName,\n          role: initialRole,\n          createdAt: serverTimestamp()\n        });\n        detectedRole = initialRole.toUpperCase();\n      }\n"""
          new = """      } else {\n        // Do not infer or create privileged portal identities from the selected login tab.\n        // Parent/student identities are provisioned by their registration flows; staff/school\n        // and administrative accounts must already have an authoritative users/{uid} record.\n        const parentDoc = await getDoc(doc(db, 'parents', user.uid));\n        if (parentDoc.exists()) {\n          detectedRole = 'PARENT';\n          if (parentDoc.data().name) detectedName = parentDoc.data().name;\n        }\n\n        if (!detectedRole) {\n          const tutorDoc = await getDoc(doc(db, 'tutors', user.uid));\n          if (tutorDoc.exists()) {\n            detectedRole = 'STAFF';\n            if (tutorDoc.data().name) detectedName = tutorDoc.data().name;\n          }\n        }\n\n        if (!detectedRole) {\n          await signOut(auth).catch(() => undefined);\n          throw new Error('No active portal profile was found for this account. Please complete registration or contact an administrator.');\n        }\n\n        await setDoc(doc(db, 'users', user.uid), {\n          email: user.email?.toLowerCase(),\n          name: detectedName,\n          role: detectedRole.toLowerCase(),\n          createdAt: serverTimestamp()\n        }, { merge: true });\n      }\n"""
          if old not in text:
              raise SystemExit('Portal login block not found')
          portal.write_text(text.replace(old, new))

          staff = Path('src/components/admin/AdminStaff.tsx')
          text = staff.read_text()
          for line in [
              "  const [inviteName, setInviteName] = useState('');\n",
              "  const [inviteEmail, setInviteEmail] = useState('');\n",
              "  const [inviting, setInviting] = useState(false);\n",
          ]:
              text = text.replace(line, '')
          text = text.replace('{/* Staff Members List */}', '{/* Staff Members List */}')
          text = text.replace('👨‍🏫 {staff.name || staff.fullName || \'Faculty Member\'}', '{staff.name || staff.fullName || \'Faculty Member\'}')
          text = text.replace('📞 {staff.phone}', '{staff.phone}')
          staff.write_text(text)

          pages = Path('src/pages/admin/AdminPages.tsx')
          text = pages.read_text()
          old_loop = """        // Ensure these entries exist in Firestore\n        for (const p of merged) {\n          await setDoc(doc(db, 'pages', p.id), {\n            id: p.id,\n            title: p.title,\n            path: p.path,\n            status: p.status,\n            description: p.description\n          }, { merge: true });\n        }\n        \n"""
          if old_loop not in text:
              raise SystemExit('AdminPages hydration write loop not found')
          text = text.replace(old_loop, '')
          text = text.replace("import { collection, getDocs, doc, setDoc } from 'firebase/firestore';", "import { collection, getDocs } from 'firebase/firestore';")
          pages.write_text(text)

          inquiry = Path('src/pages/admin/AdminInquiries.tsx')
          inquiry.write_text(r'''import React, { useEffect, useMemo, useState } from 'react';
import { collection, doc, onSnapshot, updateDoc, serverTimestamp, addDoc } from 'firebase/firestore';
import { Download, X, Search, Mail, Phone, CalendarDays, UserRound, Filter, Save, ArrowUpRight } from 'lucide-react';
import { db, auth } from '../../lib/firebase';
import { useToast } from '../../contexts/ToastContext';

type LeadStage = 'NEW' | 'CONTACTED' | 'QUALIFIED' | 'CONVERTED' | 'LOST' | 'CLOSED';

const LEAD_STAGES: { value: LeadStage; label: string }[] = [
  { value: 'NEW', label: 'New' },
  { value: 'CONTACTED', label: 'Contacted' },
  { value: 'QUALIFIED', label: 'Qualified' },
  { value: 'CONVERTED', label: 'Converted' },
  { value: 'LOST', label: 'Lost' },
  { value: 'CLOSED', label: 'Closed' },
];

const stageClasses: Record<LeadStage, string> = {
  NEW: 'bg-sky-50 text-sky-700 border-sky-200 dark:bg-sky-950/40 dark:text-sky-300 dark:border-sky-900',
  CONTACTED: 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-900',
  QUALIFIED: 'bg-violet-50 text-violet-700 border-violet-200 dark:bg-violet-950/40 dark:text-violet-300 dark:border-violet-900',
  CONVERTED: 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-900',
  LOST: 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-900',
  CLOSED: 'bg-slate-100 text-slate-700 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700',
};

const toDate = (value: any) => {
  if (!value) return null;
  if (typeof value?.toDate === 'function') return value.toDate();
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
};

const formatDate = (value: any, withTime = false) => {
  const date = toDate(value);
  return date ? date.toLocaleString(undefined, withTime ? undefined : { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
};

const csvValue = (value: unknown) => `"${String(value ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;

const AdminInquiries: React.FC = () => {
  const { toast } = useToast();
  const [inquiries, setInquiries] = useState<any[]>([]);
  const [loading, setLoading] = useState(true);
  const [selectedInquiry, setSelectedInquiry] = useState<any | null>(null);
  const [search, setSearch] = useState('');
  const [stageFilter, setStageFilter] = useState<'ALL' | LeadStage>('ALL');
  const [saving, setSaving] = useState(false);

  const [draft, setDraft] = useState({
    status: 'NEW' as LeadStage,
    assignedTo: '',
    nextFollowUp: '',
    internalNotes: '',
  });

  useEffect(() => {
    const unsubscribe = onSnapshot(
      collection(db, 'inquiries'),
      snapshot => {
        setInquiries(snapshot.docs.map(item => ({ id: item.id, ...item.data() })));
        setLoading(false);
      },
      error => {
        console.error('Failed to subscribe to inquiries:', error);
        setLoading(false);
        toast.error('Could not load the lead pipeline.');
      }
    );
    return () => unsubscribe();
  }, [toast]);

  useEffect(() => {
    if (!selectedInquiry) return;
    setDraft({
      status: String(selectedInquiry.status || 'NEW').toUpperCase() as LeadStage,
      assignedTo: selectedInquiry.assignedTo || '',
      nextFollowUp: selectedInquiry.nextFollowUp || '',
      internalNotes: selectedInquiry.internalNotes || '',
    });
  }, [selectedInquiry]);

  const normalizedSearch = search.trim().toLowerCase();
  const sortedInquiries = useMemo(
    () => [...inquiries].sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0)),
    [inquiries]
  );

  const filteredInquiries = useMemo(() => sortedInquiries.filter(item => {
    const stage = String(item.status || 'NEW').toUpperCase() as LeadStage;
    if (stageFilter !== 'ALL' && stage !== stageFilter) return false;
    if (!normalizedSearch) return true;
    const haystack = [item.name, item.email, item.phone, item.schoolName, item.type, item.role, item.message]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    return haystack.includes(normalizedSearch);
  }), [normalizedSearch, sortedInquiries, stageFilter]);

  const counts = useMemo(() => inquiries.reduce<Record<string, number>>((acc, item) => {
    const stage = String(item.status || 'NEW').toUpperCase();
    acc[stage] = (acc[stage] || 0) + 1;
    acc.ALL = (acc.ALL || 0) + 1;
    return acc;
  }, { ALL: 0 }), [inquiries]);

  const saveLead = async () => {
    if (!selectedInquiry) return;
    setSaving(true);
    try {
      const previousStatus = String(selectedInquiry.status || 'NEW').toUpperCase();
      const payload = {
        status: draft.status,
        assignedTo: draft.assignedTo.trim(),
        nextFollowUp: draft.nextFollowUp || null,
        internalNotes: draft.internalNotes.trim(),
        updatedBy: auth.currentUser?.uid || null,
        updatedAt: serverTimestamp(),
      };
      await updateDoc(doc(db, 'inquiries', selectedInquiry.id), payload);
      await addDoc(collection(db, 'activityLogs'), {
        action: 'INQUIRY_UPDATED',
        inquiryId: selectedInquiry.id,
        actorId: auth.currentUser?.uid || null,
        previousStatus,
        nextStatus: draft.status,
        assignedTo: draft.assignedTo.trim() || null,
        timestamp: serverTimestamp(),
      }).catch(() => undefined);
      setSelectedInquiry(null);
      toast.success('Lead record updated successfully.');
    } catch (error: any) {
      console.error('Failed to update lead:', error);
      toast.error(error?.message || 'Could not update this lead.');
    } finally {
      setSaving(false);
    }
  };

  const quickStatusUpdate = async (item: any, status: LeadStage) => {
    try {
      await updateDoc(doc(db, 'inquiries', item.id), {
        status,
        updatedBy: auth.currentUser?.uid || null,
        updatedAt: serverTimestamp(),
      });
    } catch (error: any) {
      toast.error(error?.message || 'Could not update lead stage.');
    }
  };

  const exportToCSV = () => {
    const headers = ['Name', 'Email', 'Phone', 'Type', 'School', 'Status', 'Assigned To', 'Next Follow Up', 'Created At'];
    const rows = filteredInquiries.map(item => [
      item.name,
      item.email,
      item.phone,
      item.type,
      item.schoolName,
      item.status || 'NEW',
      item.assignedTo,
      item.nextFollowUp,
      formatDate(item.createdAt, true),
    ]);
    const content = [headers.map(csvValue).join(','), ...rows.map(row => row.map(csvValue).join(','))].join('\n');
    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `jaystarbliss_leads_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    toast.success(`Exported ${filteredInquiries.length} lead${filteredInquiries.length === 1 ? '' : 's'}.`);
  };

  return (
    <div className="space-y-6">
      <header className="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <div className="flex items-center gap-2 text-brand-red text-xs font-black uppercase tracking-[0.18em]">
            <Filter size={14} /> CRM Pipeline
          </div>
          <h1 className="mt-1 text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">Inquiries & Leads</h1>
          <p className="mt-1 text-sm text-slate-500 dark:text-slate-400">Track every inquiry from first contact through qualification, conversion, and closure.</p>
        </div>
        <button type="button" onClick={exportToCSV} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
          <Download size={16} /> Export filtered CSV
        </button>
      </header>

      <section className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6" aria-label="Lead stages">
        <button type="button" onClick={() => setStageFilter('ALL')} className={`rounded-2xl border p-4 text-left transition ${stageFilter === 'ALL' ? 'border-brand-red ring-2 ring-brand-red/10' : 'border-slate-200 dark:border-slate-800'} bg-white dark:bg-slate-900`}>
          <span className="text-[10px] font-black uppercase tracking-wider text-slate-400">All leads</span>
          <strong className="mt-1 block text-xl text-slate-900 dark:text-white">{counts.ALL || 0}</strong>
        </button>
        {LEAD_STAGES.map(stage => (
          <button key={stage.value} type="button" onClick={() => setStageFilter(stage.value)} className={`rounded-2xl border p-4 text-left transition ${stageFilter === stage.value ? 'border-brand-red ring-2 ring-brand-red/10' : 'border-slate-200 dark:border-slate-800'} bg-white dark:bg-slate-900`}>
            <span className="text-[10px] font-black uppercase tracking-wider text-slate-400">{stage.label}</span>
            <strong className="mt-1 block text-xl text-slate-900 dark:text-white">{counts[stage.value] || 0}</strong>
          </button>
        ))}
      </section>

      <div className="flex flex-col gap-3 sm:flex-row">
        <label className="relative flex-1">
          <Search size={17} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={search} onChange={event => setSearch(event.target.value)} placeholder="Search name, email, school, phone, message…" className="min-h-11 w-full rounded-xl border border-slate-200 bg-white pl-10 pr-4 text-sm outline-none focus:border-brand-red focus:ring-2 focus:ring-brand-red/10 dark:border-slate-700 dark:bg-slate-900 dark:text-white" />
        </label>
      </div>

      <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div className="overflow-x-auto">
          <table className="min-w-[900px] w-full divide-y divide-slate-200 dark:divide-slate-800">
            <thead className="bg-slate-50 dark:bg-slate-950/70">
              <tr>
                <th className="px-5 py-3 text-left text-[10px] font-black uppercase tracking-wider text-slate-500">Lead</th>
                <th className="px-5 py-3 text-left text-[10px] font-black uppercase tracking-wider text-slate-500">Source</th>
                <th className="px-5 py-3 text-left text-[10px] font-black uppercase tracking-wider text-slate-500">Stage</th>
                <th className="px-5 py-3 text-left text-[10px] font-black uppercase tracking-wider text-slate-500">Owner / Follow-up</th>
                <th className="px-5 py-3 text-left text-[10px] font-black uppercase tracking-wider text-slate-500">Received</th>
                <th className="px-5 py-3 text-right text-[10px] font-black uppercase tracking-wider text-slate-500">Action</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
              {loading ? (
                <tr><td colSpan={6} className="px-5 py-14 text-center text-sm text-slate-400">Loading lead pipeline…</td></tr>
              ) : filteredInquiries.length === 0 ? (
                <tr><td colSpan={6} className="px-5 py-14 text-center text-sm text-slate-400">No leads match the current filters.</td></tr>
              ) : filteredInquiries.map(item => {
                const stage = String(item.status || 'NEW').toUpperCase() as LeadStage;
                return (
                  <tr key={item.id} className="align-top hover:bg-slate-50/70 dark:hover:bg-slate-950/50">
                    <td className="px-5 py-4">
                      <div className="font-bold text-slate-900 dark:text-white">{item.name || 'Unnamed lead'}</div>
                      <div className="mt-1 text-xs text-slate-500 dark:text-slate-400">{item.email || 'No email'}</div>
                      {item.phone && <div className="mt-1 text-xs text-slate-500 dark:text-slate-400">{item.phone}</div>}
                    </td>
                    <td className="px-5 py-4">
                      <div className="text-xs font-bold uppercase tracking-wider text-brand-slate dark:text-slate-200">{String(item.type || 'GENERAL').replace(/_/g, ' ')}</div>
                      {item.schoolName && <div className="mt-1 text-xs text-slate-500">{item.schoolName}</div>}
                    </td>
                    <td className="px-5 py-4">
                      <select value={stage} onChange={event => quickStatusUpdate(item, event.target.value as LeadStage)} className={`rounded-lg border px-2.5 py-1.5 text-xs font-black outline-none ${stageClasses[stage] || stageClasses.NEW}`} aria-label={`Update stage for ${item.name || 'lead'}`}>
                        {LEAD_STAGES.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                      </select>
                    </td>
                    <td className="px-5 py-4">
                      <div className="text-xs font-semibold text-slate-700 dark:text-slate-300">{item.assignedTo || 'Unassigned'}</div>
                      <div className="mt-1 text-[11px] text-slate-400">{item.nextFollowUp ? `Follow-up ${item.nextFollowUp}` : 'No follow-up set'}</div>
                    </td>
                    <td className="px-5 py-4 whitespace-nowrap text-xs text-slate-500">{formatDate(item.createdAt)}</td>
                    <td className="px-5 py-4 text-right">
                      <button type="button" onClick={() => setSelectedInquiry(item)} className="inline-flex min-h-10 items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold text-brand-red hover:bg-red-50 dark:hover:bg-red-950/30">Open <ArrowUpRight size={14} /></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {selectedInquiry && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" role="dialog" aria-modal="true" aria-labelledby="lead-dialog-title">
          <div className="flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl dark:bg-slate-900">
            <header className="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 dark:border-slate-800">
              <div>
                <p className="text-[10px] font-black uppercase tracking-[0.18em] text-brand-red">Lead record</p>
                <h2 id="lead-dialog-title" className="mt-1 text-xl font-black text-slate-900 dark:text-white">{selectedInquiry.name || 'Unnamed lead'}</h2>
                <p className="mt-1 text-xs text-slate-500">Received {formatDate(selectedInquiry.createdAt, true)}</p>
              </div>
              <button type="button" onClick={() => setSelectedInquiry(null)} className="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-white" aria-label="Close lead details"><X size={20} /></button>
            </header>

            <div className="grid gap-6 overflow-y-auto p-5 lg:grid-cols-[1.15fr_.85fr]">
              <div className="space-y-5">
                <div className="grid gap-4 sm:grid-cols-2">
                  <a href={selectedInquiry.email ? `mailto:${selectedInquiry.email}` : undefined} className="rounded-xl border border-slate-200 p-4 dark:border-slate-800"><div className="flex items-center gap-2 text-[10px] font-black uppercase tracking-wider text-slate-400"><Mail size={14} /> Email</div><div className="mt-2 text-sm font-semibold text-brand-red break-all">{selectedInquiry.email || 'Not provided'}</div></a>
                  <a href={selectedInquiry.phone ? `tel:${selectedInquiry.phone}` : undefined} className="rounded-xl border border-slate-200 p-4 dark:border-slate-800"><div className="flex items-center gap-2 text-[10px] font-black uppercase tracking-wider text-slate-400"><Phone size={14} /> Phone</div><div className="mt-2 text-sm font-semibold text-slate-800 dark:text-white">{selectedInquiry.phone || 'Not provided'}</div></a>
                </div>

                <div className="rounded-xl border border-slate-200 p-4 dark:border-slate-800">
                  <div className="grid gap-4 sm:grid-cols-2">
                    <div><div className="text-[10px] font-black uppercase tracking-wider text-slate-400">Lead type</div><div className="mt-1 text-sm font-semibold text-slate-800 dark:text-white">{String(selectedInquiry.type || 'GENERAL').replace(/_/g, ' ')}</div></div>
                    <div><div className="text-[10px] font-black uppercase tracking-wider text-slate-400">Role / position</div><div className="mt-1 text-sm font-semibold text-slate-800 dark:text-white">{selectedInquiry.role || '—'}</div></div>
                    <div><div className="text-[10px] font-black uppercase tracking-wider text-slate-400">School</div><div className="mt-1 text-sm font-semibold text-slate-800 dark:text-white">{selectedInquiry.schoolName || '—'}</div></div>
                    <div><div className="text-[10px] font-black uppercase tracking-wider text-slate-400">Last updated</div><div className="mt-1 text-sm font-semibold text-slate-800 dark:text-white">{formatDate(selectedInquiry.updatedAt || selectedInquiry.createdAt, true)}</div></div>
                  </div>
                </div>

                {selectedInquiry.programsOfInterest?.length > 0 && <div><div className="mb-2 text-[10px] font-black uppercase tracking-wider text-slate-400">Programs of interest</div><div className="flex flex-wrap gap-2">{selectedInquiry.programsOfInterest.map((program: string, index: number) => <span key={`${program}-${index}`} className="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-200">{program}</span>)}</div></div>}

                {selectedInquiry.message && <div><div className="mb-2 text-[10px] font-black uppercase tracking-wider text-slate-400">Message</div><div className="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm leading-7 text-slate-700 whitespace-pre-wrap dark:border-slate-800 dark:bg-slate-950 dark:text-slate-300">{selectedInquiry.message}</div></div>}
              </div>

              <aside className="space-y-4 rounded-2xl bg-slate-50 p-4 dark:bg-slate-950">
                <div className="flex items-center gap-2 text-sm font-black text-slate-900 dark:text-white"><UserRound size={16} /> Pipeline controls</div>
                <label className="block"><span className="mb-2 block text-[10px] font-black uppercase tracking-wider text-slate-500">Stage</span><select value={draft.status} onChange={event => setDraft(current => ({ ...current, status: event.target.value as LeadStage }))} className="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm font-semibold dark:border-slate-700 dark:bg-slate-900 dark:text-white">{LEAD_STAGES.map(stage => <option key={stage.value} value={stage.value}>{stage.label}</option>)}</select></label>
                <label className="block"><span className="mb-2 block text-[10px] font-black uppercase tracking-wider text-slate-500">Assigned owner</span><input value={draft.assignedTo} onChange={event => setDraft(current => ({ ...current, assignedTo: event.target.value }))} placeholder="Staff member / team" className="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm outline-none focus:border-brand-red dark:border-slate-700 dark:bg-slate-900 dark:text-white" /></label>
                <label className="block"><span className="mb-2 flex items-center gap-1.5 text-[10px] font-black uppercase tracking-wider text-slate-500"><CalendarDays size={13} /> Next follow-up</span><input type="date" value={draft.nextFollowUp} onChange={event => setDraft(current => ({ ...current, nextFollowUp: event.target.value }))} className="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm dark:border-slate-700 dark:bg-slate-900 dark:text-white" /></label>
                <label className="block"><span className="mb-2 block text-[10px] font-black uppercase tracking-wider text-slate-500">Internal notes</span><textarea rows={7} value={draft.internalNotes} onChange={event => setDraft(current => ({ ...current, internalNotes: event.target.value }))} placeholder="Private notes for the team…" className="w-full resize-y rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm leading-6 outline-none focus:border-brand-red dark:border-slate-700 dark:bg-slate-900 dark:text-white" /></label>
                <button type="button" onClick={saveLead} disabled={saving} className="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-brand-red px-4 py-2.5 text-sm font-black text-white hover:bg-red-700 disabled:opacity-60">{saving ? 'Saving…' : <><Save size={16} /> Save lead record</>}</button>
              </aside>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

export default AdminInquiries;
