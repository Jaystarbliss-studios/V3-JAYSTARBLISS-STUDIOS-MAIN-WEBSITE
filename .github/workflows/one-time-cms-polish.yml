name: One-time CMS Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'CMS completion pass') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CMS and public content completion fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          hero = Path('src/components/Hero.tsx')
          text = hero.read_text()
          old = '''        <div className="text-center lg:text-left max-w-2xl mx-auto lg:mx-0 w-full>\n          <h1 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-white leading-[1.1] mb-6 tracking-tight break-words">'''
          new = '''        <div className="text-center lg:text-left max-w-2xl mx-auto lg:mx-0 w-full">\n          <span className="inline-flex items-center rounded-full border border-white/15 bg-white/5 px-3 py-1.5 text-[10px] font-black uppercase tracking-[0.18em] text-white/70 backdrop-blur-sm">\n            {data.tagline || 'DIGITAL INNOVATION & EDUCATION'}\n          </span>\n          <h1 className="mt-5 text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-white leading-[1.1] mb-6 tracking-tight break-words">'''
          if old not in text:
              raise SystemExit('Hero content marker not found')
          text = text.replace(old, new, 1)
          marker = '''          </h1>\n          <div className="flex flex-wrap items-center justify-center lg:justify-start gap-3 sm:gap-6 mt-8 w-full max-w-full">'''
          replacement = '''          </h1>\n          <p className="mx-auto max-w-xl text-base sm:text-lg leading-7 text-white/70 lg:mx-0">\n            {data.description || 'Jaystarbliss Studios empowers the next generation through practical tech education, coding programs for kids, and scalable software solutions.'}\n          </p>\n          <div className="flex flex-wrap items-center justify-center lg:justify-start gap-3 sm:gap-6 mt-8 w-full max-w-full">'''
          if marker not in text:
              raise SystemExit('Hero CTA marker not found')
          hero.write_text(text.replace(marker, replacement, 1))

          form = Path('src/pages/admin/AdminPageForm.tsx')
          text = form.read_text()
          anchor = "const AdminPageForm: React.FC = () => {"
          component = r'''const SectionField: React.FC<{
  field: EditablePageConfig['sections'][number]['fields'][number];
  value: any;
  onChange: (value: any) => void;
}> = ({ field, value, onChange }) => {
  const label = field.label;
  const base = 'w-full rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-red';

  if (field.type === 'image') {
    return (
      <div className="col-span-1 md:col-span-2">
        <CloudinaryImageUpload
          label={label}
          value={value || ''}
          onChange={onChange}
          helpText="Upload a high-resolution image to Cloudinary or paste a direct Cloudinary URL."
        />
      </div>
    );
  }

  if (field.type === 'textarea') {
    return (
      <div className="col-span-1 md:col-span-2">
        <label className="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">{label}</label>
        <textarea rows={4} value={value ?? ''} onChange={event => onChange(event.target.value)} placeholder={field.placeholder || `Enter ${label.toLowerCase()}`} className={`${base} px-4 py-3 leading-relaxed`} />
      </div>
    );
  }

  if (field.type === 'boolean') {
    return (
      <label className="col-span-1 flex min-h-11 cursor-pointer items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 dark:border-slate-700 dark:bg-slate-800">
        <input type="checkbox" checked={Boolean(value)} onChange={event => onChange(event.target.checked)} className="h-4 w-4 accent-[var(--brand-red)]" />
        <span className="text-sm font-semibold text-slate-700 dark:text-slate-200">{label}</span>
      </label>
    );
  }

  if (field.type === 'select') {
    return (
      <div className="col-span-1">
        <label className="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">{label}</label>
        <select value={value ?? ''} onChange={event => onChange(event.target.value)} className={`${base} min-h-11 px-4 py-3`}>
          <option value="">Select {label.toLowerCase()}</option>
          {(field.options || []).map(option => <option key={option} value={option}>{option}</option>)}
        </select>
      </div>
    );
  }

  if (field.type === 'list') {
    const listValue = Array.isArray(value) ? value.join('\n') : String(value ?? '');
    return (
      <div className="col-span-1 md:col-span-2">
        <label className="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">{label}</label>
        <textarea rows={6} value={listValue} onChange={event => onChange(event.target.value.split(/\r?\n/).map(item => item.trim()).filter(Boolean))} placeholder={field.placeholder || 'Enter one item per line'} className={`${base} px-4 py-3 leading-relaxed`} />
        <p className="mt-1.5 text-[11px] text-slate-400">Enter one item per line.</p>
      </div>
    );
  }

  if (field.type === 'url') {
    return (
      <div className="col-span-1">
        <label className="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">{label}</label>
        <input type="url" value={value ?? ''} onChange={event => onChange(event.target.value)} placeholder={field.placeholder || 'https://'} className={`${base} min-h-11 px-4 py-3`} />
      </div>
    );
  }

  return (
    <div className="col-span-1">
      <label className="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">{label}</label>
      <input type="text" value={value ?? ''} onChange={event => onChange(event.target.value)} placeholder={field.placeholder || `Enter ${label.toLowerCase()}`} className={`${base} min-h-11 px-4 py-3`} />
    </div>
  );
};

'''
          if anchor not in text:
              raise SystemExit('AdminPageForm component anchor not found')
          text = text.replace(anchor, component + anchor, 1)

          pattern = re.compile(r"\{section\.fields\.map\(\(field\) => \{.*?\n\s*\}\)\}\n", re.S)
          replacement = '''{section.fields.map((field) => {\n                      const val = currentValues[field.key] ?? '';\n                      return (\n                        <SectionField\n                          key={field.key}\n                          field={field}\n                          value={val}\n                          onChange={(value) => handleFieldChange(section.id, field.key, value)}\n                        />\n                      );\n                    })}\n'''
          if not pattern.search(text):
              raise SystemExit('AdminPageForm field renderer block not found')
          form.write_text(pattern.sub(replacement, text, count=1))

          learning = Path('src/components/home/LearningMethod.tsx')
          text = learning.read_text()
          text = text.replace("import { motion } from 'motion/react';", "import { motion } from 'motion/react';\nimport { usePageSection } from '../../lib/cms';")
          start = text.index("const LearningMethod: React.FC = () => {")
          end = text.index("export default LearningMethod;", start)
          replacement = r'''const LearningMethod: React.FC = () => {
  const { data } = usePageSection('home', 'learning_method', {
    title: 'LEARN. PRACTICE. BUILD. SHOWCASE.',
    subtitle: "We believe learning becomes much more meaningful when students get the chance to use what they've learned.",
    step1Title: '1. Foundation & Concepts',
    step1Desc: 'Master the core ideas before moving into application.',
    step2Title: '2. Guided Practice',
    step2Desc: 'Work through practical exercises with feedback from experienced mentors.',
    step3Title: '3. Independent Creation',
    step3Desc: 'Design and implement an original project using the skills you have developed.',
    step4Title: '4. Showcase & Presentation',
    step4Desc: 'Present the finished work and build a portfolio of real achievements.'
  });

  const cmsSteps = [
    { num: '01', title: data.step1Title, description: data.step1Desc },
    { num: '02', title: data.step2Title, description: data.step2Desc },
    { num: '03', title: data.step3Title, description: data.step3Desc },
    { num: '04', title: data.step4Title, description: data.step4Desc },
  ];

  return (
    <section className="py-24 bg-white dark:bg-slate-900 dark:border-slate-800 border-t border-gray-100">
      <div className="container mx-auto px-4 md:px-8 max-w-7xl">
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
          <Reveal className="lg:col-span-5">
            <h2 className="text-3xl md:text-5xl font-extrabold text-brand-slate dark:text-white mb-6 tracking-tight leading-[1.1]">
              {data.title || 'LEARN. PRACTICE. BUILD. SHOWCASE.'}
            </h2>
            <p className="text-xl text-gray-600 dark:text-gray-400 font-medium leading-relaxed">
              {data.subtitle || "We believe learning becomes much more meaningful when students get the chance to use what they've learned."}
            </p>
          </Reveal>

          <div className="lg:col-span-7">
            <StaggerGroup className="space-y-8" staggerDelay={0.12}>
              {cmsSteps.map((step) => (
                <motion.div key={step.num} variants={staggerItem} className="flex gap-6 group">
                  <div className="w-16 h-16 rounded-2xl bg-white/70 dark:bg-slate-900/60 backdrop-blur-md border border-white/60 dark:border-white/10 flex items-center justify-center text-xl font-black text-brand-red shrink-0 group-hover:bg-brand-red group-hover:text-white group-hover:border-brand-red transition-all shadow-sm">
                    {step.num}
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-2">{step.title}</h3>
                    <p className="text-lg text-gray-600 dark:text-gray-400 font-medium">{step.description}</p>
                  </div>
                </motion.div>
              ))}
            </StaggerGroup>
          </div>
        </div>
      </div>
    </section>
  );
};
'''
          learning.write_text(text[:start] + replacement + text[end:])

          readme = Path('README.md')
          readme.write_text('''# Jaystarbliss Studios | Dynamic Hub\n\nA premium full-stack educational, technology and creative platform for Jaystarbliss Studios. It combines the public website, Firestore-powered content management, role-scoped portals, school operations, payments and administrative controls in one React application.\n\n## Platform capabilities\n\n- **Public Hub:** Home, Programs, Services, Portfolio, Resources, FAQ, Blog, contact and project requests.\n- **Role-based Portals:** Students, Parents, Staff/Tutors and Schools with role-specific navigation and data access.\n- **School Operations:** School-scoped students, resources, links, exams, passcodes and staff-school assignments.\n- **Learning Portal:** Persisted curriculum, course progress, schedules, live classes, resources and certificates.\n- **Payments:** Authenticated Paystack initialization, server-side verification/webhook reconciliation and enrollment-linked payment context.\n- **Admin CMS:** Page/section editing, Programs, Services, Portfolio, Kids Zone, News/Blog, Resources, Users & RBAC, Approvals, Staff operations, analytics and settings.\n- **Lead CRM:** Inquiry pipeline with searchable stages, assignment, follow-up dates, internal notes and activity logging.\n- **Security:** Firebase Auth state checks, server-trusted privileged provisioning, school isolation and Firestore ownership/role enforcement.\n- **UX system:** Repository-local UI/UX Pro Max guidance, accessible touch targets, visible focus states, responsive layouts and reduced-motion support.\n\n## Technical stack\n\n- **Frontend:** React 19, TypeScript, Vite, Tailwind CSS\n- **Routing:** React Router\n- **Backend:** Firebase Auth + Firestore + Netlify Functions\n- **Payments:** Paystack\n- **Media:** Cloudinary upload workflows\n- **Animation:** Motion\n- **Charts:** Recharts\n- **Icons:** Lucide React\n\n## Roles\n\n`USER`, `STUDENT`, `PARENT`, `STAFF`/`TUTOR`, `SCHOOL`, `CONTENT_ADMIN`, `EDUCATION_ADMIN`, `SERVICES_ADMIN`, `MARKETING_ADMIN`, `SUPPORT_ADMIN`, `SUPER_ADMIN`.\n\nPrivileged roles and administrative profiles are provisioned through trusted server-side workflows; portal route state is not treated as an authorization source.\n\n## Development\n\n1. Configure Firebase, Paystack and the required Netlify/Firebase environment variables from the deployment documentation.\n2. Install dependencies: `npm ci`\n3. Run locally: `npm run dev`\n4. Validate: `npm run lint`\n5. Production build: `npm run build`\n\nThe GitHub Quality Gate runs lint and production build on pushes and pull requests targeting `main`.\n\n## Security operations\n\nSee `SECURITY_MODEL.md` and `docs/PAYSTACK-OPERATIONS.md` for the authorization model, trusted workflows, payment verification and deployment requirements.\n''')
          PY

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "Jaystarbliss Studios"
          git config user.email "82984404+Jaystarbliss-studios@users.noreply.github.com"
          rm -f .github/workflows/one-time-cms-polish.yml
          git add src/components/Hero.tsx src/pages/admin/AdminPageForm.tsx src/components/home/LearningMethod.tsx README.md .github/workflows/one-time-cms-polish.yml
          git diff --cached --quiet && { echo "No changes produced"; exit 0; }
          git commit -m "feat: CMS completion pass for editable content and lead platform"
          git push
