name: Finalize curriculum permission fix

on:
  push:
    branches:
      - fix/curriculum-resource-permissions

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove permission effect self-dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/portal/ResourceLibrary.tsx')
          text = path.read_text()
          old = "  }, [role, canManageCurriculum]);"
          new = "  }, [role]);"
          if old not in text:
              raise SystemExit('Expected curriculum permission effect dependency was not found.')
          path.write_text(text.replace(old, new, 1))
      - name: Typecheck and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ResourceLibrary.tsx
          git commit -m "fix: stabilize curriculum permission resolution"
          git rm .github/workflows/finalize-curriculum-permission-fix.yml
          git commit -m "chore: remove temporary curriculum permission check"
          git push origin HEAD:fix/curriculum-resource-permissions
