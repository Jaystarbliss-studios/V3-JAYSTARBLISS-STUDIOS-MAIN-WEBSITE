name: Inspect schedule scope
on:
  workflow_dispatch:
  push:
    branches: [fix/tutor-school-private-schedule-scope]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture focused source slices
        shell: bash
        run: |
          set -e
          rm -rf inspect-slices
          mkdir -p inspect-slices
          sed -n '1,120p' src/components/portal/PortalLayout.tsx > inspect-slices/portal-layout-1.txt
          sed -n '121,260p' src/components/portal/PortalLayout.tsx > inspect-slices/portal-layout-2.txt
          sed -n '1,140p' src/pages/portal/StaffDashboard.tsx > inspect-slices/staff-dashboard-1.txt
          sed -n '141,320p' src/pages/portal/StaffDashboard.tsx > inspect-slices/staff-dashboard-2.txt
          sed -n '1,260p' netlify/functions/class-schedules.ts > inspect-slices/class-schedules-1.txt
          sed -n '261,520p' netlify/functions/class-schedules.ts > inspect-slices/class-schedules-2.txt
      - name: Commit focused slices
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspect-slices
          git commit -m "chore: capture focused schedule source slices" || exit 0
          git push
