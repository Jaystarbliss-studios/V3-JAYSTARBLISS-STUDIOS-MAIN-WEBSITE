name: Inspect schedule scope
on:
  workflow_dispatch:
  push:
    branches: [fix/tutor-school-private-schedule-scope]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant files
        shell: bash
        run: |
          set -e
          : > schedule-scope-diagnostic.txt
          for f in \
            src/components/portal/StaffClassSchedulesManager.tsx \
            src/components/portal/PortalLayout.tsx \
            src/pages/portal/StaffDashboard.tsx \
            src/pages/portal/StudentDashboard.tsx \
            src/pages/portal/SchoolDashboard.tsx \
            src/pages/portal/ParentDashboard.tsx \
            netlify/functions/class-schedules.ts \
            firestore.rules; do
            echo "===== $f =====" >> schedule-scope-diagnostic.txt
            if [ -f "$f" ]; then
              grep -nE "assignedSchools|assignedStudents|filterTarget|classSchedules|schoolId|studentId|tutorId|targetType|student|schedule|appearance|Billing|Log Out|sidebar|imperson" "$f" | head -n 320 >> schedule-scope-diagnostic.txt || true
            else
              echo "MISSING" >> schedule-scope-diagnostic.txt
            fi
          done
          echo "===== package scripts =====" >> schedule-scope-diagnostic.txt
          cat package.json >> schedule-scope-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-scope-diagnostic.txt
          git commit -m "chore: add schedule scope diagnostic" || exit 0
          git push
